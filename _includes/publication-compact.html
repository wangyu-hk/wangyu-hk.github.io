<div class="publication-entry" style="margin-bottom: 1.5em;">

  <div style="line-height: 1.65;">
    {{ post.citation }}
  </div>

  {% if post.paperurl %}
    <div style="margin-top: 0.25em;">
      <a href="{{ post.paperurl }}"
         target="_blank"
         rel="noopener noreferrer">
        {% if page.lang == "zh" %}
          查看论文
        {% else %}
          Read More
        {% endif %}
      </a>
    </div>
  {% endif %}

</div>
